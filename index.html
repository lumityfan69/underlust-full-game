<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underlust: Neon Echoes</title>
    <style>
        body { background-color: #05050a; color: #ffffff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #game-window { width: 640px; height: 480px; background-color: #000000; border: 4px solid #ff00ff; position: relative; overflow: hidden; box-shadow: 0 0 20px #ff00ff; }
        #text-box { position: absolute; bottom: 20px; left: 20px; width: 592px; height: 120px; border: 3px solid #ffffff; background: #000; padding: 10px; box-sizing: border-box; font-size: 18px; color: #ff66cc; }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        button { background: #000; color: #fff; border: 2px solid #fff; padding: 10px 20px; font-family: monospace; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff66cc; color: #000; border-color: #ff66cc; }
    </style>
</head>
<body>

    <h1 style="color: #33ccff; letter-spacing: 2px;">GLYPH-3: UNDERLUST ENGINE</h1>
    
    <div id="game-window">
        <!-- Overworld view placeholder -->
        <div id="zone-title" style="padding: 20px; font-size: 24px; text-align: center; color: #33ccff;">Loading game file...</div>
        <div id="text-box">* A neon light flickers in the distance.</div>
    </div>

    <div class="btn-container">
        <button onclick="pressButton('FIGHT')">FIGHT</button>
        <button onclick="pressButton('ACT')">ACT</button>
        <button onclick="pressButton('ITEM')">ITEM</button>
        <button onclick="pressButton('MERCY')">MERCY</button>
    </div>

    <script src="js/maps.js"></script>
    <script src="js/battles.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
